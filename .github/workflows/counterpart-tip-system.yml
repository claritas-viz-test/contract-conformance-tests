name: counterpart-tip contract system
on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  current-production-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: { GH_TOKEN: "${{ secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Require authorized counterpart access
        shell: bash
        run: |
          set -euo pipefail
          p="${GITHUB_REPOSITORY_OWNER%-test}"
          if ! gh api "repos/$p/claritas-infra" >/dev/null 2>&1; then
            echo "::error title=cross-org authorization required::TEST_FLEET_GITHUB_TOKEN must be able to read private $p repositories; semantic contract checks were not executed"
            exit 1
          fi
      - name: Test 1 - current counterpart tips are reachable
        shell: bash
        run: |
          set -euo pipefail
          p="${GITHUB_REPOSITORY_OWNER%-test}"
          gh api --paginate "orgs/$p/repos?per_page=100&type=all" --jq '.[]|select(.archived==false)|[.name,.default_branch]|@tsv' >/tmp/repos
          test -s /tmp/repos
          while IFS=$'\t' read -r r b; do
            s="$(gh api "repos/$p/$r/commits/$b" --jq .sha)"
            [[ "$s" =~ ^[0-9a-f]{40}$ ]]
          done </tmp/repos
      - name: Test 2 - a current first-class contract authority exists
        shell: bash
        run: |
          set -euo pipefail
          p="${GITHUB_REPOSITORY_OWNER%-test}"
          f=0
          n=0
          while IFS=$'\t' read -r r b; do
            if [[ "$r" =~ (interfaces|api|schema|contract|lib-core|infra) ]]; then
              n=$((n+1))
              s="$(gh api "repos/$p/$r/commits/$b" --jq .sha)"
              if gh api "repos/$p/$r/git/trees/$s?recursive=1" --jq '.tree[].path' | grep -Eq '(^|/)(\.ores-infra\.toml|\.zpkg\.toml|[^/]+\.tsp|[^/]+\.proto|[^/]+\.wit|openapi[^/]*\.(json|ya?ml)|[^/]*schema[^/]*\.json)$'; then
                f=1
                break
              fi
            fi
          done </tmp/repos
          test "$n" -gt 0
          test "$f" -eq 1
      - name: Test 3 - zed-pkg dependency tip is reachable
        shell: bash
        run: |
          set -euo pipefail
          b="$(gh api repos/zed-pkg/zed-cli --jq .default_branch)"
          s="$(gh api "repos/zed-pkg/zed-cli/commits/$b" --jq .sha)"
          [[ "$s" =~ ^[0-9a-f]{40}$ ]]
