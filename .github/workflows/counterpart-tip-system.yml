name: counterpart-tip contract system
on: { pull_request: {}, push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  current-production-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Test 1 - source-locked private authority is intact
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .source_repo counterpart-source-lock.json)" = "claritas-viz/claritas-infra"
          test "$(jq -r .source_head_sha counterpart-source-lock.json)" = "ebd8176cf4f6dc557c4c1e04bd0ea44a87b3b9eb"
          while IFS=$'\t' read -r path expected; do
            test -f "$path"
            test "$(git hash-object "$path")" = "$expected"
          done < <(jq -r '.files | to_entries[] | [.key,.value] | @tsv' counterpart-source-lock.json)
      - name: Test 2 - TypeSpec and JSON Schema remain peer authorities
        shell: bash
        run: |
          set -euo pipefail
          tsp=fixtures/counterpart-snapshot/claritas-infra/contracts/infra-gitops/main.tsp
          schema=fixtures/counterpart-snapshot/claritas-infra/contracts/infra-gitops/authored.schema.json
          grep -q 'model InfraGitOpsContract' "$tsp"
          grep -q 'supabaseRoot' "$tsp"
          grep -q 'neonRoot' "$tsp"
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' "$schema" >/dev/null
          jq -e '."$defs".InfraGitOpsContract.unevaluatedProperties == false' "$schema" >/dev/null
      - name: Test 3 - zed-pkg dependency tip is reachable
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          b="$(gh api repos/zed-pkg/zed-cli --jq .default_branch)"
          s="$(gh api "repos/zed-pkg/zed-cli/commits/$b" --jq .sha)"
          [[ "$s" =~ ^[0-9a-f]{40}$ ]]
          echo "Claritas private authority pinned at ebd8176cf4f6dc557c4c1e04bd0ea44a87b3b9eb; zed-cli current public tip: $s"
