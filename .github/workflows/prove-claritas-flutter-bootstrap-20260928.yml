name: Prove exact Claritas Flutter bootstrap candidate

on:
  push:
    branches:
      - proof/claritas-flutter-bootstrap-20260928
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proof carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Bind every changed source blob exactly
        shell: bash
        run: |
          set -euo pipefail
          root=proof/claritas-flutter
          test "$(git hash-object "$root/.gitignore")" = '6a7685a4b2fe5341c5bf08a36a5dcbdc79fbc200'
          test "$(git hash-object "$root/README.md")" = 'f35b09cffa4556194355c87e335800c4e18c23e0'
          test "$(git hash-object "$root/pubspec.yaml")" = '59284e9d877514412868948c6236bff9376ee174'
          test "$(git hash-object "$root/lib/claritas_flutter.dart")" = 'f8d6551434b764266f3a1e234f47b6fd332b5eec'
          test "$(git hash-object "$root/lib/src/claritas_surface.dart")" = '6168bce45c279b12f248007644a001e6cfa2c78f'
          test "$(git hash-object "$root/test/claritas_surface_test.dart")" = '607233c59ec74c046d0bbd8725a4dbf061a2b58a'
          test "$(git hash-object "$root/ci.yml")" = '739afaa969c9675f9d33113c414c6da25d266274'
      - name: Actionlint exact candidate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: proof/claritas-flutter/ci.yml
      - name: Set up exact Flutter SDK
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      - name: Resolve SDK dependencies
        working-directory: proof/claritas-flutter
        run: flutter pub get
      - name: Check formatting
        working-directory: proof/claritas-flutter
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        working-directory: proof/claritas-flutter
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        working-directory: proof/claritas-flutter
        run: flutter test
      - name: Prove verification did not mutate tracked package source
        run: git diff --exit-code -- proof/claritas-flutter
