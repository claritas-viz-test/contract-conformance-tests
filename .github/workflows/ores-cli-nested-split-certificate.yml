name: ORES nested split current-main certificate

on:
  pull_request:
    paths:
      - 'canaries/ores-nested-split/**'
      - '.github/workflows/ores-cli-nested-split-certificate.yml'
      - '.github/workflows/peer-authority-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Claritas test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Claritas revision and product lock
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('canaries/ores-nested-split/product-lock.json', 'utf8'));
          const expected = {
            productHead: '8d80a6988021612d3f5e12ee017b1bac2d793abb',
            productBase: '7b2fed43836d723474a6cf86de7167d576b6a1e1',
            scannerBlob: 'b62260c4324568757315cc7adef98110b746a7d4',
            dispatcherBlob: '09938dcbb458f314f27e7adf1847f53528668ec3',
            rustToolchain: '1.95.0',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (lock[key] !== value) throw new Error(`${key} mismatch: ${lock[key]} != ${value}`);
          }
          if (lock.authorityModel.typespec !== 'independently-authored-first-class') throw new Error('TypeSpec authority drift');
          if (lock.authorityModel.jsonSchema !== 'independently-authored-draft-2020-12-first-class') throw new Error('JSON Schema authority drift');
          if (lock.authorityModel.precedence !== 'none') throw new Error('authority precedence must remain none');
          if (lock.authorityModel.generatedSchemaB !== 'comparison-evidence-only') throw new Error('generated Schema B role drift');
          NODE

      - name: Bind exact private product source identities
        run: |
          set -euo pipefail
          test "$(git hash-object canaries/ores-nested-split/src/audit/nested_split_peer_contracts.rs)" = 'b62260c4324568757315cc7adef98110b746a7d4'
          test "$(git hash-object canaries/ores-nested-split/product-audit-mod.rs)" = '09938dcbb458f314f27e7adf1847f53528668ec3'

      - name: Install exact ORES Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Generate isolated harness lockfile
        working-directory: canaries/ores-nested-split
        run: cargo +1.95.0 generate-lockfile

      - name: Format and compile exact production scanner
        working-directory: canaries/ores-nested-split
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 check --locked --lib
          cargo +1.95.0 clippy --locked --lib -- -D warnings

      - name: Execute exact scanner against Claritas and adversarial fixtures
        working-directory: canaries/ores-nested-split
        env:
          ORES_CLI_TEST_NESTED_SPLIT_REPO: ${{ github.workspace }}
        run: cargo +1.95.0 test --locked --test external_claritas -- --nocapture

      - name: Prove authored contract authorities stayed immutable
        run: git diff --exit-code -- contracts
