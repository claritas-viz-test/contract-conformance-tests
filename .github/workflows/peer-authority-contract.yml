name: Peer authority contract

on:
  pull_request:
    paths:
      - "contracts/visualization-query/**"
      - ".github/workflows/peer-authority-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/visualization-query/**"
      - ".github/workflows/peer-authority-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tjsv-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Claritas test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact test revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Bind independently authored source bytes
        id: authored
        shell: bash
        run: |
          set -euo pipefail
          printf 'typespec=%s\n' "$(sha256sum contracts/visualization-query/main.tsp | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'schema=%s\n' "$(sha256sum contracts/visualization-query/authored.schema.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Check out exact canonical TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
          path: .tjsv
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: .tjsv/package-lock.json

      - name: Install pinned TJSV dependency closure
        run: npm ci --prefix .tjsv

      - name: Transpile TypeSpec and compare generated vs authored JSON Schema
        run: |
          set -euo pipefail
          rm -rf .typespec-json-schema-validator/claritas
          mkdir -p .typespec-json-schema-validator/claritas/generated
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec contracts/visualization-query/main.tsp \
            --schema contracts/visualization-query/authored.schema.json \
            --instances contracts/visualization-query/instances \
            --output-dir .typespec-json-schema-validator/claritas/generated \
            --bundle-id typespec.generated.schema.json \
            --report .typespec-json-schema-validator/claritas/report.json \
            --sarif .typespec-json-schema-validator/claritas/report.sarif \
            --contract-ir .typespec-json-schema-validator/claritas/contract-ir.json \
            --quiet

      - name: Require independent peer roles and comparison-only Schema B
        shell: bash
        run: |
          set -euo pipefail
          report=.typespec-json-schema-validator/claritas/report.json
          ir=.typespec-json-schema-validator/claritas/contract-ir.json
          generated=.typespec-json-schema-validator/claritas/generated/typespec.generated.schema.json
          test -s "$generated"
          jq -e '
            .schema == "ores.typespec-json-schema-validator.report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            .authorities.precedence == "none" and
            .authorities.typespec.authority == "independently-authored" and
            .authorities.jsonSchema.authority == "independently-authored" and
            .authorities.typespec.generatedJsonSchemaRole == "comparison-evidence-only" and
            .coverage.typespecGeneratedJsonSchemaComparison == true and
            .coverage.differentialInstanceValidation == true and
            (.differential.summary.probesEvaluated // 0) > 0 and
            (.differential.summary.divergences // 0) == 0 and
            (.differential.summary.refusals // 0) == 0
          ' "$report"
          jq -e '
            .schema == "ores.typespec-json-schema-validator.contract-ir/v1" and
            .status == "passed" and
            .admissible == true and
            .role == "downstream-derived-parity-artifact" and
            .editableAuthority == false
          ' "$ir"
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' "$generated"

      - name: Reject one-sided authored JSON Schema drift
        shell: bash
        run: |
          set -euo pipefail
          case_dir="$RUNNER_TEMP/claritas-json-schema-drift"
          rm -rf "$case_dir"
          mkdir -p "$case_dir/generated"
          cp contracts/visualization-query/authored.schema.json "$case_dir/authored.schema.json"
          python3 - "$case_dir/authored.schema.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          schema = json.loads(path.read_text(encoding="utf-8"))
          schema["$defs"]["VisualizationQueryV1"]["properties"]["limit"]["maximum"] = 499
          path.write_text(json.dumps(schema, indent=2) + "\n", encoding="utf-8")
          PY
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec contracts/visualization-query/main.tsp \
            --schema "$case_dir/authored.schema.json" \
            --instances contracts/visualization-query/instances \
            --output-dir "$case_dir/generated" \
            --report "$case_dir/report.json" \
            --contract-ir "$case_dir/contract-ir.json" \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2
          jq -e '
            .status == "stopped_for_evaluation" and
            any(.findings[]; .ruleId == "generated-authored-semantic-mismatch")
          ' "$case_dir/report.json"
          mkdir -p .typespec-json-schema-validator/negative
          cp "$case_dir/report.json" .typespec-json-schema-validator/negative/json-schema-drift.report.json

      - name: Reject one-sided authored TypeSpec drift
        shell: bash
        run: |
          set -euo pipefail
          case_dir="$RUNNER_TEMP/claritas-typespec-drift"
          rm -rf "$case_dir"
          mkdir -p "$case_dir/generated"
          cp contracts/visualization-query/main.tsp "$case_dir/main.tsp"
          python3 - "$case_dir/main.tsp" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          old = "  @maxValue(500)\n  limit: integer;"
          new = "  @maxValue(499)\n  limit: integer;"
          if source.count(old) != 1:
              raise SystemExit("expected one limit constraint anchor")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$case_dir/main.tsp" \
            --schema contracts/visualization-query/authored.schema.json \
            --instances contracts/visualization-query/instances \
            --output-dir "$case_dir/generated" \
            --report "$case_dir/report.json" \
            --contract-ir "$case_dir/contract-ir.json" \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2
          jq -e '
            .status == "stopped_for_evaluation" and
            any(.findings[]; .ruleId == "generated-authored-semantic-mismatch")
          ' "$case_dir/report.json"
          cp "$case_dir/report.json" .typespec-json-schema-validator/negative/typespec-drift.report.json

      - name: Prove authored sources remained immutable
        env:
          EXPECTED_TYPESPEC_SHA256: ${{ steps.authored.outputs.typespec }}
          EXPECTED_SCHEMA_SHA256: ${{ steps.authored.outputs.schema }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum contracts/visualization-query/main.tsp | awk '{print $1}')" = "$EXPECTED_TYPESPEC_SHA256"
          test "$(sha256sum contracts/visualization-query/authored.schema.json | awk '{print $1}')" = "$EXPECTED_SCHEMA_SHA256"
          git diff --exit-code -- contracts/visualization-query

      - name: Retain deterministic parity evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claritas-peer-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: .typespec-json-schema-validator
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
