name: Peer authority contract

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/peer-authority-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/peer-authority-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tjsv-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        contract: [visualization-query, visualization-catalog]
    steps:
      - name: Check out exact Claritas test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact test revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out exact canonical TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
          path: .tjsv
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - name: Install pinned TJSV dependency closure
        run: npm ci --prefix .tjsv
      - name: Transpile TypeSpec A to Schema B and compare with authored Schema A
        env:
          CONTRACT: ${{ matrix.contract }}
        run: |
          set -euo pipefail
          root="contracts/$CONTRACT"
          out=".typespec-json-schema-validator/$CONTRACT"
          rm -rf "$out"
          mkdir -p "$out/generated"
          authored_before="$(sha256sum "$root/authored.schema.json" | cut -d' ' -f1)"
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$root/main.tsp" \
            --schema "$root/authored.schema.json" \
            --instances "$root/instances" \
            --output-dir "$out/generated" \
            --bundle-id typespec.generated.schema.json \
            --report "$out/report.json" \
            --sarif "$out/report.sarif" \
            --contract-ir "$out/contract-ir.json" \
            --quiet
          test -s "$out/generated/typespec.generated.schema.json"
          test -s "$out/report.json"
          test -s "$out/contract-ir.json"
          authored_after="$(sha256sum "$root/authored.schema.json" | cut -d' ' -f1)"
          test "$authored_before" = "$authored_after"
          test "$root/authored.schema.json" != "$out/generated/typespec.generated.schema.json"
          grep -F '"$schema": "https://json-schema.org/draft/2020-12/schema"' "$root/authored.schema.json"
      - name: Prove one-sided authored JSON Schema drift fails closed
        if: matrix.contract == 'visualization-catalog'
        run: |
          set -euo pipefail
          root="contracts/visualization-catalog"
          scratch="$RUNNER_TEMP/schema-drift"
          cp -R "$root" "$scratch"
          node - "$scratch/authored.schema.json" <<'JS'
          const fs = require('node:fs');
          const path = process.argv[2];
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          value.$defs.VisualizationFamily.enum[0] = 'chart-drift';
          fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          JS
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check --typespec "$scratch/main.tsp" --schema "$scratch/authored.schema.json" --instances "$scratch/instances" --output-dir "$RUNNER_TEMP/schema-drift-out" --bundle-id typespec.generated.schema.json --report "$RUNNER_TEMP/schema-drift-report.json" --contract-ir "$RUNNER_TEMP/schema-drift-ir.json" --quiet
          status=$?
          set -e
          test "$status" -eq 2
      - name: Prove one-sided TypeSpec drift fails closed
        if: matrix.contract == 'visualization-catalog'
        run: |
          set -euo pipefail
          root="contracts/visualization-catalog"
          scratch="$RUNNER_TEMP/typespec-drift"
          cp -R "$root" "$scratch"
          sed -i 's/chart: "chart"/chart: "chart-drift"/' "$scratch/main.tsp"
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check --typespec "$scratch/main.tsp" --schema "$scratch/authored.schema.json" --instances "$scratch/instances" --output-dir "$RUNNER_TEMP/typespec-drift-out" --bundle-id typespec.generated.schema.json --report "$RUNNER_TEMP/typespec-drift-report.json" --contract-ir "$RUNNER_TEMP/typespec-drift-ir.json" --quiet
          status=$?
          set -e
          test "$status" -eq 2
