name: Peer authority contract

on:
  pull_request:
    paths:
      - "contracts/visualization-query/**"
      - ".github/workflows/peer-authority-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/visualization-query/**"
      - ".github/workflows/peer-authority-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tjsv-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Claritas test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact test revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact canonical TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
          path: .tjsv
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0

      - name: Install pinned TJSV dependency closure
        run: npm ci --prefix .tjsv

      - name: Transpile TypeSpec and compare generated vs authored JSON Schema
        run: |
          set -euo pipefail
          rm -rf .typespec-json-schema-validator/claritas
          mkdir -p .typespec-json-schema-validator/claritas/generated
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec contracts/visualization-query/main.tsp \
            --schema contracts/visualization-query/authored.schema.json \
            --instances contracts/visualization-query/instances \
            --output-dir .typespec-json-schema-validator/claritas/generated \
            --bundle-id typespec.generated.schema.json \
            --report .typespec-json-schema-validator/claritas/report.json \
            --sarif .typespec-json-schema-validator/claritas/report.sarif \
            --contract-ir .typespec-json-schema-validator/claritas/contract-ir.json \
            --quiet
          test -s .typespec-json-schema-validator/claritas/generated/typespec.generated.schema.json
          test -s .typespec-json-schema-validator/claritas/report.json
          test -s .typespec-json-schema-validator/claritas/contract-ir.json
          test "$(jq -r '."'"'$schema'"'"'' contracts/visualization-query/authored.schema.json)" = "https://json-schema.org/draft/2020-12/schema"
