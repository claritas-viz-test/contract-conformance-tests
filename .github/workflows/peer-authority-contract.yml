name: Peer authority contract

on:
  pull_request:
    paths:
      - "contracts/visualization-query/**"
      - "contracts/visualization-catalog/**"
      - ".github/workflows/peer-authority-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/visualization-query/**"
      - "contracts/visualization-catalog/**"
      - ".github/workflows/peer-authority-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tjsv-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        contract: [visualization-query, visualization-catalog]
    steps:
      - name: Check out exact Claritas test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact test revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Bind independently authored source bytes
        id: authored
        shell: bash
        env:
          CONTRACT: ${{ matrix.contract }}
        run: |
          set -euo pipefail
          root="contracts/$CONTRACT"
          printf 'typespec=%s\n' "$(sha256sum "$root/main.tsp" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'schema=%s\n' "$(sha256sum "$root/authored.schema.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Check out exact canonical TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
          path: .tjsv
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: .tjsv/package-lock.json

      - name: Install pinned TJSV dependency closure
        run: npm ci --prefix .tjsv

      - name: Transpile TypeSpec and compare generated vs authored JSON Schema
        env:
          CONTRACT: ${{ matrix.contract }}
        shell: bash
        run: |
          set -euo pipefail
          root="contracts/$CONTRACT"
          out=".typespec-json-schema-validator/$CONTRACT"
          rm -rf "$out"
          mkdir -p "$out/generated"
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$root/main.tsp" \
            --schema "$root/authored.schema.json" \
            --instances "$root/instances" \
            --output-dir "$out/generated" \
            --bundle-id typespec.generated.schema.json \
            --report "$out/report.json" \
            --sarif "$out/report.sarif" \
            --contract-ir "$out/contract-ir.json" \
            --quiet

      - name: Require independent peer roles and comparison-only Schema B
        env:
          CONTRACT: ${{ matrix.contract }}
        shell: bash
        run: |
          set -euo pipefail
          out=".typespec-json-schema-validator/$CONTRACT"
          report="$out/report.json"
          ir="$out/contract-ir.json"
          generated="$out/generated/typespec.generated.schema.json"
          test -s "$generated"
          jq -e '
            .schema == "ores.typespec-json-schema-validator.report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            .authorities.precedence == "none" and
            .authorities.typespec.authority == "independently-authored" and
            .authorities.jsonSchema.authority == "independently-authored" and
            .authorities.typespec.generatedJsonSchemaRole == "comparison-evidence-only" and
            .coverage.typespecGeneratedJsonSchemaComparison == true and
            .coverage.differentialInstanceValidation == true and
            (.differential.summary.probesEvaluated // 0) > 0 and
            (.differential.summary.divergences // 0) == 0 and
            (.differential.summary.refusals // 0) == 0
          ' "$report"
          jq -e '
            .schema == "ores.typespec-json-schema-validator.contract-ir/v1" and
            .status == "passed" and
            .admissible == true and
            .role == "downstream-derived-parity-artifact" and
            .editableAuthority == false
          ' "$ir"
          jq -e '."$schema" == "https://json-schema.org/draft/2020-12/schema"' "$generated"

      - name: Reject one-sided authored JSON Schema drift
        env:
          CONTRACT: ${{ matrix.contract }}
        shell: bash
        run: |
          set -euo pipefail
          root="contracts/$CONTRACT"
          case_dir="$RUNNER_TEMP/$CONTRACT-json-schema-drift"
          rm -rf "$case_dir"
          mkdir -p "$case_dir/generated"
          cp "$root/authored.schema.json" "$case_dir/authored.schema.json"
          node - "$case_dir/authored.schema.json" <<'JS'
          const fs = require('node:fs');
          const path = process.argv[2];
          const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
          const defs = schema.$defs ??= {};
          defs.__TjsvNegativeControl = {
            $schema: 'https://json-schema.org/draft/2020-12/schema',
            $id: '__TjsvNegativeControl',
            type: 'string',
          };
          fs.writeFileSync(path, `${JSON.stringify(schema, null, 2)}\n`);
          JS
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$root/main.tsp" \
            --schema "$case_dir/authored.schema.json" \
            --instances "$root/instances" \
            --output-dir "$case_dir/generated" \
            --report "$case_dir/report.json" \
            --contract-ir "$case_dir/contract-ir.json" \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2
          jq -e '.status == "stopped_for_evaluation" and (.findings | length) > 0' "$case_dir/report.json"
          test -s "$case_dir/generated/typespec.generated.schema.json"

      - name: Reject one-sided authored TypeSpec drift
        env:
          CONTRACT: ${{ matrix.contract }}
        shell: bash
        run: |
          set -euo pipefail
          root="contracts/$CONTRACT"
          case_dir="$RUNNER_TEMP/$CONTRACT-typespec-drift"
          rm -rf "$case_dir"
          mkdir -p "$case_dir/generated"
          cp "$root/main.tsp" "$case_dir/main.tsp"
          cat >> "$case_dir/main.tsp" <<'EOF'

          model __TjsvNegativeControl {
            marker: string;
          }
          EOF
          set +e
          node .tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec "$case_dir/main.tsp" \
            --schema "$root/authored.schema.json" \
            --instances "$root/instances" \
            --output-dir "$case_dir/generated" \
            --report "$case_dir/report.json" \
            --contract-ir "$case_dir/contract-ir.json" \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2
          jq -e '.status == "stopped_for_evaluation" and (.findings | length) > 0' "$case_dir/report.json"
          test -s "$case_dir/generated/typespec.generated.schema.json"

      - name: Prove authored sources remained immutable
        env:
          CONTRACT: ${{ matrix.contract }}
          EXPECTED_TYPESPEC_SHA256: ${{ steps.authored.outputs.typespec }}
          EXPECTED_SCHEMA_SHA256: ${{ steps.authored.outputs.schema }}
        shell: bash
        run: |
          set -euo pipefail
          root="contracts/$CONTRACT"
          test "$(sha256sum "$root/main.tsp" | awk '{print $1}')" = "$EXPECTED_TYPESPEC_SHA256"
          test "$(sha256sum "$root/authored.schema.json" | awk '{print $1}')" = "$EXPECTED_SCHEMA_SHA256"
          git diff --exit-code -- "$root"

      - name: Retain deterministic parity evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claritas-peer-authority-${{ matrix.contract }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .typespec-json-schema-validator/${{ matrix.contract }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
